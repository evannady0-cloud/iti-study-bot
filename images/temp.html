<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: #1e293b;
    border: 2px solid #38bdf8;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    width: 100%;
    box-sizing: border-box;
    text-align: center;
  }
  .title {
    font-size: 1.2em;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 15px;
    border-bottom: 1px solid #334155;
    padding-bottom: 8px;
  }
  /* 3x3 Matrix */
  .matrix {
    display: grid;
    grid-template-columns: repeat(3, 85px);
    grid-template-rows: repeat(3, 85px);
    gap: 10px;
    justify-content: center;
    margin: 15px auto;
  }
  .cell {
    background: #0f172a;
    border: 2px solid #64748b;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    color: #f8fafc;
  }
  .cell-q {
    background: #1e3a8a;
    border: 2px dashed #38bdf8;
    color: #38bdf8;
    font-weight: bold;
  }
  /* Cube Net */
  .cube-grid {
    display: grid;
    grid-template-columns: repeat(4, 55px);
    grid-template-rows: repeat(3, 55px);
    gap: 6px;
    justify-content: center;
    margin: 15px auto;
  }
  .cube-cell {
    background: #0f172a;
    border: 2px solid #64748b;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
    font-weight: bold;
  }
  .empty { border: none; background: transparent; }
  /* Dominoes */
  .domino-row {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    margin: 20px auto;
  }
  .domino {
    width: 55px;
    height: 100px;
    background: #f8fafc;
    color: #0f172a;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    border: 2px solid #cbd5e1;
    font-size: 1.4em;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .d-half {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .d-divider {
    height: 2px;
    background: #94a3b8;
    width: 100%;
  }
  .q-mark {
    background: #1e3a8a;
    color: #38bdf8;
    border: 2px dashed #38bdf8;
  }
  /* Gears */
  .gears-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin: 25px auto;
  }
  .gear {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 6px dashed #38bdf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-size: 1.1em;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    
  <div class="title">3x3 Visual Matrix: Dot Addition</div>
  <div class="matrix">
    <div class="cell">●</div>
    <div class="cell">●●</div>
    <div class="cell">●●●</div>
    <div class="cell">●●</div>
    <div class="cell">●●●</div>
    <div class="cell">●●●●</div>
    <div class="cell">●●●</div>
    <div class="cell">●●●●</div>
    <div class="cell cell-q">?</div>
  </div>
  <div style="color: #94a3b8; font-size: 0.95em;">How many dots belong in the missing box [ ? ] ?</div>

  </div>
</body>
</html>
